[project]
name = "fv"
version = "0.9.0"
description = "Terminal file explorer with a live, editable preview pane"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
highlight = ["pygments>=2.10"]

[project.scripts]
fv = "fv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["fv.py"]
